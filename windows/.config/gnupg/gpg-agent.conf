# @desc<<
# This file configures the GPG agent for caching passphrases
# and enables SSH agent support for GPG keys.
#<<

# Cache settings (10 minutes)
default-cache-ttl 600
max-cache-ttl 7200

# Enable SSH agent support
enable-ssh-support
