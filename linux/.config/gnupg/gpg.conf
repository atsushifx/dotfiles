# GnuPG Configuration for WSL
# Adapted from Windows-side config for cross-platform harmony
# Author: Furukawa Atsushi <atsushifx@gmail.com>
# Date: 2025-04-09

# Keyserver settings
keyserver hkps://keys.openpgp.org

# Hash algorithm for signatures
cert-digest-algo SHA256

# Use GPG agent
use-agent

# Allow terminal-based passphrase input
pinentry-mode loopback

# Set default signing key
default-key atsushifx@gmail.com

