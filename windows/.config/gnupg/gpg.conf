# @desc<<
# This is a minimal and portable GnuPG configuration
# that can be used on both Linux and Windows.
# It removes default settings and only includes the essentials.
#<<

# Keyserver settings
keyserver hkps://keys.openpgp.org

# Hash algorithm for signatures
cert-digest-algo SHA256

# Use GPG agent
use-agent

# Default signing key (Replace with your key ID)
default-key atsushifx@gmail.com
